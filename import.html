<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f7f8fc" />
    <meta name="description" content="Import question banks for 逢考必过，超肠发挥" />
    <title>Import · 逢考必过，超肠发挥</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="theme.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="index.html" aria-label="Back to practice">
          <span class="brand-mark">逢</span>
          <span>逢考必过，超肠发挥</span>
        </a>
        <div class="topbar-right">
          <div class="language-switch" aria-label="Language">
            <button class="language-button" data-lang="en" type="button">EN</button>
            <button class="language-button" data-lang="ja" type="button">日本語</button>
            <button class="language-button" data-lang="zh" type="button">中文</button>
          </div>
        </div>
      </header>

      <main class="main-content">
        <section class="hero">
          <div class="hero-copy">
            <div class="eyebrow" data-i18n="eyebrow"></div>
            <h1 data-i18n="title"></h1>
            <p class="lead" data-i18n="lead"></p>
          </div>
        </section>

        <div class="import-grid">
          <section class="card import-card">
            <h2 data-i18n="pickHeading"></h2>
            <label class="dropzone" id="dropzone">
              <input type="file" id="file-input" accept=".json,application/json" hidden />
              <span class="dropzone-text" data-i18n="dropText"></span>
              <span class="btn btn-secondary btn-small" data-i18n="pickButton"></span>
            </label>
            <div id="preview" class="import-preview" aria-live="polite"></div>
          </section>

          <section class="card import-card">
            <h2 data-i18n="savedHeading"></h2>
            <p class="workspace-hint" data-i18n="savedHint"></p>
            <div id="saved-list" class="saved-list"></div>
            <a class="btn btn-primary import-open" href="index.html" data-i18n="openPractice"></a>
          </section>
        </div>

        <section class="card import-card">
          <h2 data-i18n="formatHeading"></h2>
          <p class="lead-small" data-i18n="formatIntro"></p>
          <div class="table-scroll">
            <table class="format-table">
              <thead>
                <tr><th data-i18n="colField"></th><th data-i18n="colRequired"></th><th data-i18n="colDesc"></th></tr>
              </thead>
              <tbody id="format-rows"></tbody>
            </table>
          </div>
          <p class="workspace-hint" data-i18n="formatNote"></p>
        </section>

        <section class="card import-card">
          <div class="card-heading">
            <div>
              <h2 data-i18n="sampleHeading"></h2>
              <p data-i18n="sampleIntro"></p>
            </div>
            <div class="workspace-row">
              <button class="btn btn-secondary btn-small" id="copy-sample" type="button" data-i18n="copySample"></button>
              <button class="btn btn-primary btn-small" id="download-sample" type="button" data-i18n="downloadSample"></button>
            </div>
          </div>
          <pre class="sample-code" id="sample-code"></pre>
        </section>
      </main>

      <footer class="site-footer">
        <span>逢考必过，超肠发挥</span>
        <span data-i18n="footer"></span>
      </footer>
    </div>
    <script src="bank-store.js"></script>
    <script src="import.js"></script>
  </body>
</html>
