<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f7f8fc" />
    <meta name="description" content="Practice question banks in English, Japanese, and Simplified Chinese." />
    <title>逢考必过，超肠发挥</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="逢考必过，超肠发挥 home" id="home-link">
          <span class="brand-mark">逢</span>
          <span>逢考必过，超肠发挥</span>
        </a>
        <div class="topbar-right">
          <span class="exam-label">PRACTICE</span>
          <div class="language-switch" aria-label="Language">
            <button class="language-button" data-language="en" type="button">EN</button>
            <button class="language-button is-active" data-language="ja" type="button">日本語</button>
            <button class="language-button" data-language="zh" type="button">中文</button>
            <button class="language-button compare-button" data-language="all" type="button" aria-label="三言語対照表示">三言語</button>
          </div>
        </div>
      </header>

      <main id="app" class="main-content" aria-live="polite"></main>

      <footer class="site-footer">
        <span>逢考必过，超肠发挥</span>
        <span id="footer-note">個人学習用のオリジナル練習問題</span>
      </footer>
    </div>
    <script src="banks/ccar-f-foundations/questions.js"></script>
    <script src="banks/ccar-f-foundations/question-bank.js"></script>
    <script src="banks/ccar-f-foundations/translation-bank.js"></script>
    <script src="bank-store.js"></script>
    <script src="app.js"></script>
  </body>
</html>
